<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Centre Médical</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#eefaf8;
padding:15px;
}

.container{
max-width:600px;
margin:auto;
}

header{
height:250px;
border-radius:20px;

background:
linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.55)),
url("images/medical.jpg");

background-size:cover;
background-position:center;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

color:white;
text-align:center;
}

header h1{
font-size:27px;
}

h2{
margin:25px 0 15px;
color:#028090;
}

.doctors{
display:grid;
gap:15px;
}

.doctor{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.doctor img{
width:100%;
height:200px;
object-fit:cover;
}

.info{
padding:15px;
}

.info h3{
color:#028090;
}

.appointment{
display:block;
background:#00a896;
color:white;
padding:14px;
text-align:center;
text-decoration:none;
border-radius:10px;
font-weight:bold;
margin-top:12px;
}

.home{
display:block;
background:#0366d6;
color:white;
text-align:center;
padding:14px;
border-radius:10px;
text-decoration:none;
margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<header>

<h1>🏥 CENTRE MÉDICAL</h1>

<p>Votre santé, notre priorité</p>

</header>

<h2>👨‍⚕️ Nos praticiens</h2>

<div class="doctors">

<div class="doctor">

<img src="images/medecin1.jpg">

<div class="info">

<h3>Dr. Jean</h3>

<p>Médecin généraliste</p>

<a href="https://wa.me/257XXXXXXXX?text=Bonjour,%20je%20voudrais%20prendre%20un%20rendez-vous"
class="appointment">
📅 Prendre rendez-vous
</a>

</div>
</div>


<div class="doctor">

<img src="images/medecin2.jpg">

<div class="info">

<h3>Dr. Marie</h3>

<p>Médecin spécialiste</p>

<a href="https://wa.me/257XXXXXXXX?text=Bonjour,%20je%20voudrais%20prendre%20un%20rendez-vous"
class="appointment">
📅 Prendre rendez-vous
</a>

</div>
</div>

</div>

<a href="index.html" class="home">
🏠 Retour à l'accueil
</a>

</div>

</body>
</html>
