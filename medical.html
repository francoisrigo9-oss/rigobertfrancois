<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Centre Médical</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#eefaf8;
padding:15px;
}

.container{
max-width:650px;
margin:auto;
}

.hero{

height:300px;

border-radius:20px;

background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.65)),
url("https://website-for-doctors.com/assets/imgs/header/4.jpg");

background-size:cover;
background-position:center;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

color:white;
text-align:center;
}

.hero h1{
font-size:30px;
}

.hero p{
margin-top:10px;
}

h2{
color:#028090;
margin:25px 0 15px;
}

.services{
display:grid;
gap:20px;
}

.card{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.card img{
width:100%;
height:240px;
object-fit:cover;
}

.info{
padding:18px;
}

.info h3{
color:#028090;
font-size:21px;
}

.info p{
margin-top:8px;
line-height:1.5;
color:#555;
}

.appointment{
display:block;
background:#00a896;
color:white;
padding:14px;
text-align:center;
text-decoration:none;
border-radius:10px;
font-weight:bold;
margin-top:15px;
}

.home{
display:block;
background:#0366d6;
color:white;
padding:15px;
text-align:center;
text-decoration:none;
border-radius:10px;
margin-top:25px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">


<header class="hero">

<h1>🏥 CENTRE MÉDICAL</h1>

<p>Votre santé, notre priorité</p>

</header>


<h2>👨‍⚕️ Nos Services</h2>


<div class="services">


<div class="card">

<img
src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&w=900&q=85"
alt="Médecin">

<div class="info">

<h3>👨‍⚕️ Consultation médicale</h3>

<p>
Consultation avec un médecin
professionnel.
</p>

<a
href="https://wa.me/257XXXXXXXX?text=Bonjour,%20je%20voudrais%20prendre%20un%20rendez-vous"
class="appointment">

📅 Prendre rendez-vous

</a>

</div>

</div>



<div class="card">

<img
src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=900&q=85"
alt="Centre médical">

<div class="info">

<h3>🩺 Suivi médical</h3>

<p>
Suivi personnalisé et accompagnement
des patients.
</p>

<a
href="https://wa.me/257XXXXXXXX?text=Bonjour,%20je%20voudrais%20prendre%20un%20rendez-vous"
class="appointment">

📅 Prendre rendez-vous

</a>

</div>

</div>


</div>


<a href="index.html" class="home">

🏠 Retour à l'accueil

</a>


</div>

</body>

</html>
