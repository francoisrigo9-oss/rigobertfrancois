<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rigobert Francois | Développeur Web & Mobile</title>
  <meta name="description" content="Portfolio professionnel de Rigobert Francois, développeur Web et Mobile à Bujumbura.">
  <meta name="theme-color" content="#0366d6">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="francois.jpg">
  <link rel="apple-touch-icon" href="francois.jpg">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #eef4ff, #f8fafc); color: #333; min-height: 100vh; padding: 20px 15px; }
    .app-container { width: 100%; max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 24px; padding: 30px 22px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10); overflow: hidden; }
    .profile-header { text-align: center; margin-bottom: 25px; }
    .profile-img { width: 115px; height: 115px; border-radius: 50%; object-fit: cover; border: 4px solid #0366d6; box-shadow: 0 6px 20px rgba(3, 102, 214, 0.25); display: block; margin: 0 auto 15px; }
    h1 { color: #0366d6; font-size: 25px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 6px; }
    .subtitle { color: #666; font-size: 15px; line-height: 1.5; }
    .app-menu-title { text-align: center; font-size: 14px; font-weight: bold; color: #777; margin: 25px 0 12px; }
    .app-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 25px; }
    .app-menu a { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 55px; padding: 8px 5px; color: white; text-decoration: none; border-radius: 11px; font-size: 12px; font-weight: 700; transition: 0.2s ease; }
    .app-menu a:hover { transform: translateY(-2px); opacity: 0.9; }
    .app-menu a:active { transform: scale(0.96); }
    .restaurant { background: linear-gradient(135deg, #d62828, #ff6b6b); }
    .boutique { background: linear-gradient(135deg, #e91e63, #9c27b0); }
    .medical { background: linear-gradient(135deg, #00a896, #028090); }
    .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; padding: 14px 18px; margin: 12px 0; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 15px; color: white; background: #0366d6; box-shadow: 0 5px 12px rgba(3, 102, 214, 0.18); transition: 0.2s ease; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(3, 102, 214, 0.25); }
    .btn:active { transform: scale(0.97); }
    .btn-whatsapp { background: #25d366; box-shadow: 0 5px 12px rgba(37, 211, 102, 0.20); }
    .btn-whatsapp:hover { background: #20bd5b; }
    .section-title { font-size: 19px; color: #222; margin: 35px 0 18px; text-align: left; border-bottom: 2px solid #0366d6; padding-bottom: 8px; font-weight: 800; }
    .project-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 15px; padding: 15px; margin-bottom: 18px; text-align: left; transition: 0.2s ease; }
    .project-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); }
    .project-banner { width: 100%; min-height: 130px; border-radius: 11px; display: flex; align-items: center; justify-content: center; text-align: center; color: #ffffff; font-weight: 700; font-size: 15px; padding: 15px; margin-bottom: 14px; }
    .restaurant-banner { background: linear-gradient(135deg, #d62828, #ff6b6b); }
    .boutique-banner { background: linear-gradient(135deg, #e91e63, #9c27b0); }
    .medical-banner { background: linear-gradient(135deg, #00a896, #028090); }
    .project-card h3 { margin-bottom: 7px; font-size: 18px; color: #0366d6; }
    .project-card p { margin-bottom: 5px; font-size: 14px; color: #555; line-height: 1.55; }
    .app-footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e5e7eb; font-size: 12px; line-height: 1.6; color: #999; text-align: center; }
    @media (max-width: 360px) { body { padding: 10px; } .app-container { padding: 25px 15px; border-radius: 18px; } .profile-img { width: 100px; height: 100px; } h1 { font-size: 21px; } .subtitle { font-size: 13px; } .app-menu { grid-template-columns: 1fr; } .project-banner { min-height: 110px; }
    @media (min-width: 768px) { body { padding-top: 40px; padding-bottom: 40px; } .app-container { max-width: 600px; padding: 40px 35px; } .project-banner { min-height: 150px; }
  </style>
</head>
