<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEKNO Football Shop</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, sans-serif;
background:#f1f3f6;
color:#222;
}

/* ================= HEADER ================= */

header{
position:sticky;
top:0;
z-index:1000;

background:#050505;
color:white;

padding:14px 5%;

display:flex;
align-items:center;
gap:20px;

box-shadow:0 3px 15px rgba(0,0,0,.3);
}

.logo{
font-size:28px;
font-weight:900;
letter-spacing:4px;
}

.back{
color:white;
text-decoration:none;
font-size:25px;
}

.search{
flex:1;
}

.search input{
width:100%;
padding:13px 20px;
border:none;
border-radius:30px;
outline:none;
font-size:15px;
}

.cart{
font-weight:bold;
white-space:nowrap;
}

/* ================= HERO ================= */

.hero{

max-width:1400px;

margin:20px auto;

min-height:300px;

border-radius:22px;

padding:40px;

display:flex;

flex-direction:column;

justify-content:center;

color:white;

background:

linear-gradient(
90deg,
rgba(0,0,0,.8),
rgba(0,0,0,.35)
),

url("francois.jpg");

background-size:cover;
background-position:center;

}

.hero h1{
font-size:45px;
margin-bottom:15px;
}

.hero p{
font-size:19px;
margin:5px 0;
}

/* ================= FILTRES ================= */

.filters{

max-width:1400px;

margin:20px auto;

padding:0 15px;

display:flex;

gap:10px;

flex-wrap:wrap;

}

.filters button{

border:none;

padding:12px 20px;

border-radius:25px;

background:white;

font-weight:bold;

cursor:pointer;

}

.filters button.active{

background:#111;

color:white;

}

/* ================= COMPTEUR ================= */

.count{

text-align:center;

color:#666;

margin:20px;

font-weight:bold;

}

/* ================= PRODUITS ================= */

.products{

max-width:1400px;

margin:auto;

padding:10px 15px 50px;

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(200px,1fr));

gap:18px;

}

.card{

background:white;

border-radius:16px;

overflow:hidden;

box-shadow:
0 4px 15px rgba(0,0,0,.10);

transition:.25s;

}

.card:hover{

transform:translateY(-6px);

box-shadow:
0 10px 25px rgba(0,0,0,.18);

}

.card img{

width:100%;

height:230px;

object-fit:cover;

display:block;

background:#eee;

}

.info{

padding:14px;

}

.category{

font-size:11px;

color:#777;

text-transform:uppercase;

font-weight:bold;

}

.name{

font-weight:bold;

font-size:16px;

margin:7px 0;

line-height:1.3;

}

.country{

font-size:13px;

color:#666;

margin-bottom:7px;

}

.price{

font-size:20px;

font-weight:900;

color:#111;

margin:8px 0;

}

.buy{

width:100%;

border:none;

background:#1769ff;

color:white;

padding:12px;

border-radius:9px;

font-weight:bold;

cursor:pointer;

}

.buy:hover{

background:#004dcc;

}

/* ================= FOOTER ================= */

footer{

background:#050505;

color:white;

text-align:center;

padding:30px;

line-height:2;

}

/* ================= MOBILE ================= */

@media(max-width:600px){

header{

gap:8px;

padding:10px;

}

.logo{

font-size:20px;

}

.search input{

padding:10px;

font-size:12px;

}

.hero{

margin:10px;

min-height:250px;

padding:25px;

}

.hero h1{

font-size:30px;

}

.hero p{

font-size:15px;

}

.products{

grid-template-columns:
repeat(2,1fr);

gap:10px;

padding:10px;

}

.card img{

height:180px;

}

.info{

padding:10px;

}

.name{

font-size:14px;

}

.price{

font-size:17px;

}

.buy{

font-size:12px;

padding:10px;

}

}

</style>

</head>

===================================================== */

let produits=[];


/* AJOUT DES MAILLOTS */

maillots.forEach(function(item){

produits.push({

type:"maillot",

nom:item[0],

pays:item[1],

image:item[2],

prix:45

});

});


/* AJOUT DES CRAMPONS */

crampons.forEach(function(item){

produits.push({

type:"crampon",

nom:item[0],

pays:item[1],

image:item[2],

prix:95

});

});


/* =====================================================
   AFFICHAGE
===================================================== */

const productsContainer =
document.getElementById("products");

const search =
document.getElementById("search");

const count =
document.getElementById("count");

let filtre="all";

let panier=0;


function afficher(){

let recherche =
search.value.toLowerCase();


let resultat=produits.filter(function(p){

let correspondType =
filtre==="all" ||
p.type===filtre;


let correspondRecherche =
p.nom.toLowerCase().includes(recherche) ||
p.pays.toLowerCase().includes(recherche);


return correspondType &&
correspondRecherche;

});


count.innerHTML =
resultat.length +
" produit(s) disponible(s)";


productsContainer.innerHTML="";


resultat.forEach(function(p){

let card=document.createElement("article");

card.className="card";


card.innerHTML=`

<img
src="${p.image}"
alt="${p.nom}"
loading="lazy"
>

<div class="info">

<div class="category">

${p.type==="maillot"
? "👕 Maillot"
: "👟 Crampon"}

</div>

<div class="name">

${p.nom}

</div>

<div class="country">

🌍 ${p.pays}

</div>

<div class="price">

${p.prix} $

</div>

<button
class="buy"
onclick="commander('${p.nom}')"
>

🛒 Commander

</button>

</div>

`;


productsContainer.appendChild(card);

});

}


/* =====================================================
   FILTRE
===================================================== */

function filterProducts(type,button){

filtre=type;


document
.querySelectorAll(".filters button")
.forEach(function(btn){

btn.classList.remove("active");

});


button.classList.add("active");


afficher();

}


/* =====================================================
   WHATSAPP
===================================================== */

function commander(nom){

panier++;

document.getElementById("cart").innerText=panier;


let message=
"Bonjour TEKNO, je voudrais commander : "
+
nom;


let url=
"https://wa.me/243971984160?text="
+
encodeURIComponent(message);


window.open(url,"_blank");

}


/* =====================================================
   RECHERCHE
===================================================== */

search.addEventListener(
"input",
afficher
);


/* AFFICHAGE INITIAL */

afficher();
