<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0366d6">
  <title>Rigobert Francois - Portfolio</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="francois.jpg.jpeg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rigobert">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { background: #f5f5f5; color: #333; text-align: center; padding: 40px 20px; }
    .container { max-width: 400px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .profile-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #0366d6; margin-bottom: 15px; }
    h1 { font-size: 24px; color: #0366d6; margin-bottom: 5px; }
    p { color: #666; margin-bottom: 25px; }
    .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #0366d6; color: white; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 16px; transition: 0.3s; }
    .btn:hover { background: #024a9e; transform: translateY(-2px); }
    .footer { margin-top: 30px; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <img src="francois.jpg.jpeg" alt="Rigobert Francois" class="profile-img">
    <h1>RIGOBERT FRANCOIS</h1>
    <p>Développeur Web à Bujumbura</p>

    <a href="projets.html" class="btn">Mes Projets</a>
    <a href="contact.html" class="btn">Me Contacter</a>
    <a href="apropos.html" class="btn">À Propos</a>
    <a href="actualite.html" class="btn">Actualité</a>

    <div class="footer">© 2026 Rigobert Francois</div>
  </div>

  <!-- SERVICE WORKER POUR MARCHER SANS INTERNET -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/rigobertfrancois/sw.js')
          .then(() => console.log('Service Worker OK'))
          .catch(err => console.log('Erreur SW:', err));
      });
    }
  </script>
</
