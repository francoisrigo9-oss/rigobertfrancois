<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#eaf2ff,#f8fafc);
color:#333;
padding:20px 15px;
}

.container{
max-width:600px;
margin:auto;
background:white;
border-radius:25px;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,.12);
}

.profile{
min-height:360px;
padding:40px 20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;

background-image:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.65)),
url("francois.jpg");

background-size:cover;
background-position:center;
}

.profile img{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:5px solid white;
margin-bottom:18px;
box-shadow:0 8px 25px rgba(0,0,0,.4);
}

.profile h1{
color:white;
font-size:27px;
margin-bottom:8px;
}

.profile p{
color:white;
font-size:15px;
}

.content{
padding:25px;
}

.title{
text-align:center;
font-size:14px;
font-weight:bold;
color:#777;
margin-bottom:15px;
}

.apps{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.apps a{
padding:18px 5px;
color:white;
text-decoration:none;
border-radius:13px;
text-align:center;
font-weight:bold;
font-size:13px;
transition:.2s;
}

.apps a:hover{
transform:translateY(-3px);
}

.restaurant{
background:linear-gradient(135deg,#d62828,#ff6b6b);
}

.boutique{
background:linear-gradient(135deg,#e91e63,#9c27b0);
}

.medical{
background:linear-gradient(135deg,#00a896,#028090);
}

.btn{
display:flex;
align-items:center;
justify-content:center;
width:100%;
padding:15px;
margin-top:13px;
border-radius:12px;
background:#0366d6;
color:white;
text-decoration:none;
font-weight:bold;
}

.whatsapp{
background:#25d366;
}

.section{
margin-top:30px;
}

.section h2{
font-size:20px;
border-bottom:2px solid #0366d6;
padding-bottom:8px;
margin-bottom:15px;
}

.footer{
text-align:center;
color:#888;
font-size:12px;
padding-top:25px;
margin-top:30px;
border-top:1px solid #ddd;
}

@media(max-width:400px){

.apps{
grid-template-columns:1fr;
}

.profile h1{
font-size:22px;
}

}

</style>
</head>

if("serviceWorker" in navigator){

window.addEventListener("load",function(){

navigator.serviceWorker.register("sw.js")

})

console.log("Erreur PWA :",error);

});
