<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Boutique de Mode</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f8f5f8;
padding:15px;
}

.container{
max-width:650px;
margin:auto;
}

.hero{

height:300px;

border-radius:20px;

background:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.65)),
url("https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=1200&q=85");

background-size:cover;
background-position:center;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

color:white;
text-align:center;
}

.hero h1{
font-size:32px;
}

.hero p{
margin-top:10px;
}

h2{
margin:25px 0 15px;
}

.products{
display:grid;
gap:20px;
}

.product{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.product img{
width:100%;
height:260px;
object-fit:cover;
}

.info{
padding:18px;
}

.info h3{
color:#9c27b0;
font-size:21px;
}

.info p{
margin-top:8px;
color:#666;
}

.price{
font-size:20px;
font-weight:bold;
margin:12px 0;
}

.order{
display:block;
background:#9c27b0;
color:white;
padding:14px;
text-align:center;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

.home{
display:block;
background:#0366d6;
color:white;
padding:15px;
text-align:center;
text-decoration:none;
border-radius:10px;
margin-top:25px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">


<header class="hero">

<h1>🛍️ MA BOUTIQUE</h1>

<p>Mode • Style • Élégance</p>

</header>


<h2>👕 Nos Produits</h2>


<div class="products">


<div class="product">

<img
src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=85"
alt="Vêtement">

<div class="info">

<h3>👕 T-Shirt Premium</h3>

<p>
T-shirt moderne et confortable.
</p>

<div class="price">
25 000 FBu
</div>

<a
href="https://wa.me/257XXXXXXXX?text=Bonjour,%20je%20voudrais%20commander%20un%20T-Shirt"
class="order">

🛒 Commander

</a>

</div>

</div>



<div class="product">

<img
src="https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3?auto=format&fit=crop&w=900&q=85"
alt="Chaussures">

<div class="info">

<h3>👟 Chaussures</h3>

<p>
Chaussures modernes et élégantes.
</p>

<div class="price">
60 000 FBu
</div>

<a
href="https://wa.me/257XXXXXXXX?text=Bonjour,%20je%20voudrais%20commander%20des%20Chaussures"
class="order">

🛒 Commander

</a>

</div>

</div>



<div class="product">

<img
src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=900&q=85"
alt="Mode">

<div class="info">

<h3>🧥 Veste</h3>

<p>
Veste élégante pour toutes occasions.
</p>

<div class="price">
80 000 FBu
</div>

<a
href="https://wa.me/257XXXXXXXX?text=Bonjour,%20je%20voudrais%20commander%20une%20Veste"
class="order">

🛒 Commander

</a>

</div>

</div>


</div>


<a href="index.html" class="home">

🏠 Retour à l'accueil

</a>


</div>

</body>

</html>
