<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Boutique de Mode</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f7f7f9;
padding:15px;
}

.container{
max-width:600px;
margin:auto;
}

header{
height:250px;
border-radius:20px;
overflow:hidden;

background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),
url("images/boutique.jpg");

background-size:cover;
background-position:center;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

color:white;
text-align:center;
}

header h1{
font-size:28px;
}

h2{
margin:25px 0 15px;
}

.products{
display:grid;
gap:15px;
}

.product{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.product img{
width:100%;
height:210px;
object-fit:cover;
}

.info{
padding:15px;
}

.info h3{
color:#9c27b0;
}

.price{
font-size:19px;
font-weight:bold;
margin:10px 0;
}

.order{
display:block;
text-align:center;
background:#9c27b0;
color:white;
padding:12px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.home{
display:block;
background:#0366d6;
color:white;
text-align:center;
padding:14px;
border-radius:10px;
text-decoration:none;
margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<header>

<h1>🛍️ MA BOUTIQUE</h1>

<p>Mode & Produits en ligne</p>

</header>

<h2>👕 Nos Produits</h2>

<div class="products">

<div class="product">

<img src="images/produit1.jpg">

<div class="info">

<h3>T-Shirt Premium</h3>

<p>T-shirt moderne et confortable.</p>

<div class="price">
25 000 FBu
</div>

<a href="https://wa.me/257XXXXXXXX?text=Bonjour,%20je%20voudrais%20commander%20un%20T-Shirt"
class="order">
🛒 Commander
</a>

</div>
</div>


<div class="product">

<img src="images/produit2.jpg">

<div class="info">

<h3>Chaussures</h3>

<p>Chaussures modernes pour homme.</p>

<div class="price">
60 000 FBu
</div>

<a href="https://wa.me/257XXXXXXXX?text=Bonjour,%20je%20voudrais%20commander%20des%20Chaussures"
class="order">
🛒 Commander
</a>

</div>
</div>


<div class="product">

<img src="images/produit3.jpg">

<div class="info">

<h3>Veste</h3>

<p>Veste élégante et moderne.</p>

<div class="price">
80 000 FBu
</div>

<a href="https://wa.me/257XXXXXXXX?text=Bonjour,%20je%20voudrais%20commander%20une%20Veste"
class="order">
🛒 Commander
</a>

</div>
</div>

</div>

<a href="index.html" class="home">
🏠 Retour à l'accueil
</a>

</div>

</body>
</html>
